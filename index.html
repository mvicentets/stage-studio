<style>
/* Layout: barra lateral fixa estilo Notion + área de trabalho em cards; o mesmo card de conteúdo aparece na produção, no calendário e no portal do cliente */
:root{
  --bg:#FFFFFF; --side:#FAFAF9; --surface:#FFFFFF; --surface-2:#F6F6F5; --col:#F7F7F6;
  --line:#ECECEA; --line-2:#DCDCD9; --hover:rgba(28,28,30,.055);
  --fg:#1C1C1E; --muted:#66666C; --faint:#97979D;
  --accent:#1A3FF5; --on-accent:#fff;
  --accent-soft:color-mix(in srgb,var(--accent) 12%,var(--surface));
  --accent-ink:color-mix(in srgb,var(--accent) 82%,var(--fg));
  --gray:#77777D; --gray-bg:#ECECE9;
  --amber:#A86A12; --amber-bg:#FBEFD6;
  --red:#C0461B; --red-bg:#FBE4DA;
  --green:#2E7D52; --green-bg:#DDF2E5;
  --blue:#2A68AC; --blue-bg:#DFEBF9;
  --shadow-sm:0 1px 2px rgba(20,20,25,.05);
  --shadow:none;
  --r:14px;
  --font:'Satoshi','Inter',-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0B0C; --side:#111113; --surface:#18181A; --surface-2:#222225; --col:#131315;
  --line:#2A2A2F; --line-2:#3A3A40; --hover:rgba(255,255,255,.06);
  --fg:#EDEDF0; --muted:#A3A3AB; --faint:#6F6F78;
  --accent-ink:color-mix(in srgb,var(--accent) 70%,#fff);
  --gray:#A3A3AB; --gray-bg:#26262B; --amber:#F0B65C; --amber-bg:#372A13;
  --red:#F28D6A; --red-bg:#3A1F16; --green:#6CCB94; --green-bg:#153223;
  --blue:#7FB2F2; --blue-bg:#15273D;
  --shadow-sm:0 1px 2px rgba(0,0,0,.35); --shadow:none;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0B0C; --side:#111113; --surface:#18181A; --surface-2:#222225; --col:#131315;
  --line:#2A2A2F; --line-2:#3A3A40; --hover:rgba(255,255,255,.06);
  --fg:#EDEDF0; --muted:#A3A3AB; --faint:#6F6F78;
  --accent-ink:color-mix(in srgb,var(--accent) 70%,#fff);
  --gray:#A3A3AB; --gray-bg:#26262B; --amber:#F0B65C; --amber-bg:#372A13;
  --red:#F28D6A; --red-bg:#3A1F16; --green:#6CCB94; --green-bg:#153223;
  --blue:#7FB2F2; --blue-bg:#15273D;
  --shadow-sm:0 1px 2px rgba(0,0,0,.35); --shadow:none;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;height:100dvh;display:flex;flex-direction:column;gap:2px;
  padding-block:18px 16px;padding-right:12px;padding-left:max(14px,env(safe-area-inset-left,0px));background:var(--side);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px;font-weight:650;font-size:15px;letter-spacing:-.01em}
.mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(90deg,#EE4A2B 0 16.6%,#F07C2A 0 33.3%,#F6B23A 0 50%,#3D8BFD 0 66.6%,#1A3FF5 0 83.3%,#5FE88A 0);color:transparent;font-size:0;flex:none}
.brand small{display:block;font-size:11.5px;color:var(--faint);font-weight:500}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500;white-space:nowrap}
.nav a:hover{background:var(--hover);color:var(--fg)}
.nav a.on{background:var(--accent-soft);color:var(--accent-ink)}
.nav a .n{margin-left:auto;font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.nav-h{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:600;padding:16px 10px 5px}
.sdot{width:17px;height:17px;display:grid;place-items:center;flex:none}
.sdot::after{content:"";width:8px;height:8px;border-radius:3px;background:var(--tf)}
.nav .count{margin-left:auto;font-size:11px;font-weight:650;background:var(--amber-bg);color:var(--amber);padding:1px 7px;border-radius:99px}
.nav-sep{height:1px;background:var(--line);margin:10px 6px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px;padding:0 4px}
.me{display:flex;align-items:center;gap:9px;font-weight:550}
.me .av{width:28px;height:28px;font-size:12px}

.seg{display:inline-flex;background:var(--hover);border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:7px;color:var(--muted);display:flex;gap:6px;align-items:center;font-weight:500;font-size:13px;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow-sm)}
.seg.full{display:flex}.seg.full button{flex:1;justify-content:center;padding:5px 6px}

.main{min-width:0;padding-block:26px 56px;padding-left:34px;padding-right:max(34px,env(safe-area-inset-right,0px))}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
h1{font-size:22px;letter-spacing:-.025em;font-weight:650;margin:0;text-wrap:balance;line-height:1.15}
h2{font-size:15px;font-weight:620;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);margin-top:5px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:9px;font-weight:550;white-space:nowrap;color:var(--fg);text-decoration:none;font-size:13.5px}
.btn:hover{border-color:var(--line-2)}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--hover);color:var(--fg)}
.btn.danger{color:var(--red)}
.btn.danger.armed{background:var(--red);color:#fff;border-color:transparent}
.btn:disabled{opacity:.6;cursor:default;filter:none}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:8px}
.icon-btn{border:0;background:transparent;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--hover);color:var(--fg)}

.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.box-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 18px 10px}
.box-b{padding:0 18px 18px}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.row{display:flex;align-items:center;gap:8px;min-width:0}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{font-variant-numeric:tabular-nums}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{padding:15px 16px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;color:var(--fg)}
.kpi:hover{border-color:var(--line-2)}
.kpi .l{color:var(--muted);font-weight:550;font-size:13px;display:flex;gap:7px;align-items:center}
.kpi .n{font-size:30px;font-weight:650;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.kpi .s{font-size:12px;color:var(--faint)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--tf);flex:none}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px;margin-top:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px;margin-top:16px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--tb);color:var(--tf);white-space:nowrap;line-height:1.5}
.t-gray{--tb:var(--gray-bg);--tf:var(--gray)}
.t-amber{--tb:var(--amber-bg);--tf:var(--amber)}
.t-red{--tb:var(--red-bg);--tf:var(--red)}
.t-green{--tb:var(--green-bg);--tf:var(--green)}
.t-blue{--tb:var(--blue-bg);--tf:var(--blue)}
.t-accent{--tb:var(--accent-soft);--tf:var(--accent-ink)}
.tag{font-size:11.5px;font-weight:550;color:var(--muted);background:var(--hover);padding:1px 7px;border-radius:6px;white-space:nowrap}
.cc{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:550;white-space:nowrap;min-width:0}
.cc i{width:8px;height:8px;border-radius:3px;background:var(--c);flex:none}
.av{width:22px;height:22px;border-radius:50%;background:var(--hover);display:grid;place-items:center;font-size:10.5px;font-weight:650;color:var(--muted);flex:none}

/* listas do dashboard */
.li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer;min-width:0}
.li:first-child{border-top:0}
.li:hover .li-t{color:var(--accent-ink)}
.li-t{font-weight:550;min-width:0}
.date-b{width:42px;flex:none;text-align:center;border-radius:9px;background:var(--surface-2);padding:4px 0;line-height:1.1}
.date-b b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.date-b span{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.04em}
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:150px minmax(0,1fr) 28px;align-items:center;gap:10px;font-size:13px}
.bar{height:8px;border-radius:99px;background:var(--hover);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.empty{padding:22px;text-align:center;color:var(--faint);border:1px dashed var(--line-2);border-radius:12px}

/* toolbar */
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 9px;color:var(--fg)}
.in:hover{border-color:var(--line-2)}
.in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
select.in,.sel{width:auto;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;color:var(--fg);font-size:13px}
.search{position:relative}
.search .in{padding-left:30px;width:200px}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--faint);width:15px;height:15px}

/* quadro */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:14px;align-items:flex-start}
.col{flex:0 0 270px;background:var(--col);border-radius:var(--r);padding:10px;min-height:220px;border:1px solid transparent}
.col.over{border-color:var(--accent);border-style:dashed}
.col-h{display:flex;align-items:center;gap:8px;padding:2px 4px 4px;font-weight:620;font-size:13px}
.col-h .n{color:var(--faint);font-weight:550}
.col-sub{font-size:11.5px;color:var(--faint);padding:0 4px 10px}
.cards{display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:10px 11px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left}
.card:hover{border-color:var(--line-2)}
.card.dragging{opacity:.4}
.card-t{font-weight:550;line-height:1.35;font-size:13.5px}
.meta{font-size:12px;color:var(--muted)}
.late{color:var(--red);font-weight:600}

/* tabela */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;min-width:640px}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:600;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--hover)}
.tbl .r{text-align:right}
.group-h td{background:var(--surface-2);font-weight:600;font-size:12.5px}

/* calendário */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.month{display:flex;align-items:center;gap:4px;font-weight:620;font-size:15px}
.month span{min-width:150px;text-align:center}
.counters{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.counters span{display:inline-flex;align-items:center;gap:5px}
.counters b{color:var(--tf);font-variant-numeric:tabular-nums}
.cal-wrap{overflow-x:auto;padding-bottom:6px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(110px,1fr));gap:6px;min-width:790px}
.dow{font-size:11px;color:var(--faint);text-align:center;font-weight:600;padding:2px 0 4px;text-transform:uppercase;letter-spacing:.06em}
.day{background:var(--surface);border:1px solid var(--line);border-radius:11px;min-height:116px;padding:7px;display:flex;flex-direction:column;gap:4px;min-width:0}
.day.out{background:transparent;border-style:dashed}
.day.out .day-n{color:var(--faint)}
.day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.day.over{border-color:var(--accent);border-style:dashed}
.day-n{font-size:12px;font-weight:620;color:var(--muted);display:flex;justify-content:space-between;align-items:center;height:20px}
.day.today .day-n b{background:var(--accent);color:var(--on-accent);border-radius:6px;padding:0 6px}
.day .add{opacity:0;border:0;background:var(--hover);width:20px;height:20px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.day .add svg{width:13px;height:13px}
.day:hover .add,.day .add:focus-visible{opacity:1}
.hol{font-size:11px;padding:2px 6px;border-radius:6px;background:var(--hover);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hol.saude{background:var(--accent-soft);color:var(--accent-ink)}
.ev{display:block;width:100%;text-align:left;font-size:11.5px;padding:4px 6px 4px 7px;border-radius:7px;background:var(--tb);color:var(--fg);border:0;border-left:3px solid var(--tf);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.ev small{display:block;font-size:10.5px;color:var(--muted);font-weight:500}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}

/* feed */
.feed-wrap{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}
.feed{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;width:min(100%,480px);border-radius:12px;overflow:hidden}
.feed .tile{position:relative;aspect-ratio:4/5;cursor:pointer;border:0;padding:0;display:block;max-width:100%}
.feed .tile .media{border-radius:0;height:100%;aspect-ratio:auto}
.feed .tile .pill{position:absolute;right:6px;top:6px;font-size:10px}
.feed .tile.dim{opacity:.45}

/* mídia */
.media{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:var(--ar,4/5);width:100%;max-width:100%;background:var(--surface-2)}
.media img,.media video{width:100%;height:100%;object-fit:cover;display:block}
.media.ph{background:linear-gradient(160deg,var(--c),color-mix(in srgb,var(--c) 40%,#111114));color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:16px;gap:6px}
.m-fmt{position:absolute;top:10px;left:10px;font-size:11px;font-weight:600;background:rgba(0,0,0,.3);color:#fff;padding:3px 8px;border-radius:99px}
.m-title{font-weight:650;font-size:17px;line-height:1.25;text-wrap:balance}
.m-client{font-size:11.5px;opacity:.82}
.media.sm{padding:8px;gap:2px}
.media.sm .m-title{font-size:10.5px;line-height:1.2}
.media.sm .m-client,.media.sm .m-fmt{display:none}

/* modal */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.backdrop{position:absolute;inset:0;background:rgba(10,10,14,.45);backdrop-filter:blur(3px)}
.sheet{position:relative;width:min(1100px,100%);max-height:100%;overflow:auto;overflow-x:hidden;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.28);display:flex;flex-direction:column}
.sheet.narrow{width:min(560px,100%)}
.sheet-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.title-in{flex:1;min-width:0;border:0;background:transparent;font-size:17px;font-weight:650;letter-spacing:-.015em;padding:5px 7px;border-radius:7px;color:var(--fg)}
.title-in:hover,.title-in:focus{background:var(--hover);outline:none}
.sheet-b{display:grid;grid-template-columns:minmax(0,330px) minmax(0,1fr);gap:24px;padding:18px}
.sheet-b.one{grid-template-columns:1fr}
.sheet-f{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.steps{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:16px;font-size:12px}
.steps span{padding:3px 8px;border-radius:99px;color:var(--faint);background:var(--surface-2);font-weight:550}
.steps span.done{color:var(--muted)}
.steps span.on{background:var(--accent);color:var(--on-accent)}
.steps span.skip{text-decoration:line-through;opacity:.6}
.steps i{color:var(--faint);font-style:normal}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 12px;margin-bottom:18px}
.field label,.lbl{display:block;font-size:11px;color:var(--faint);font-weight:600;margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
.field .in{font-size:13.5px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.tabs::-webkit-scrollbar,.viewtabs::-webkit-scrollbar{display:none}
.viewtabs{overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.tabs button{border:0;background:transparent;padding:8px 12px;color:var(--muted);font-weight:550;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--fg);border-color:var(--fg)}
textarea.in{min-height:250px;resize:vertical;line-height:1.6}
.cmt{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.cmt .av{width:28px;height:28px;font-size:11.5px}
.cmt p{margin:3px 0 0;white-space:pre-wrap}
.hist{display:flex;gap:10px;padding:7px 0;font-size:13px}
.hist time{color:var(--faint);width:92px;flex:none;font-variant-numeric:tabular-nums}
.upl{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.upl input{display:none}
.dz{margin-top:10px;border:1.5px dashed var(--line-2);border-radius:12px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;cursor:pointer;color:var(--muted);font-size:13px;transition:border-color .15s,background .15s}
.dz input{display:none}.dz b{color:var(--text);font-weight:600}.dz small{font-size:11.5px;color:var(--faint)}
.dz:hover,.dz.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,transparent)}
.dz svg{width:20px;height:20px;color:var(--accent)}
.upbox{margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.upbox .nm{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upbar{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}.upbar i{display:block;height:100%;width:0;background:var(--accent);border-radius:6px;transition:width .2s}
.upbox .meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.upok{color:var(--green,#16a34a);font-weight:600}
.drv{margin-top:10px;display:flex;flex-direction:column;gap:4px}.drv label{font-size:12px;color:var(--faint)}
.media iframe{width:100%;height:100%;border:0;display:block}

/* portal */
.portal{max-width:940px}
.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:12px;background:var(--accent-soft);color:var(--accent-ink);margin-bottom:22px;font-weight:550}
.banner .sel{margin-left:auto}
.p-hello{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.cav{width:46px;height:46px;border-radius:13px;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:650;font-size:16px;flex:none}
.p-item{display:grid;grid-template-columns:minmax(0,250px) minmax(0,1fr);gap:22px;padding:18px;margin-bottom:14px}
.caption{white-space:pre-wrap;line-height:1.6;background:var(--surface-2);border-radius:10px;padding:12px 14px;font-size:13.5px;margin:12px 0}
.kind{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:650;color:var(--amber)}
.adj{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.adj textarea{min-height:80px}

/* campanhas, clientes, financeiro */
.camp{padding:16px 18px;display:flex;flex-direction:column;gap:13px;cursor:pointer;text-align:left;color:var(--fg)}
.camp:hover{border-color:var(--line-2)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat .v{font-weight:650;font-variant-numeric:tabular-nums;font-size:15px}
.stat .k{font-size:11.5px;color:var(--faint)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:14px}
.client{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.sw{position:relative;width:34px;height:20px;border-radius:99px;background:var(--line-2);border:0;flex:none;transition:background .15s}
.sw.on{background:var(--accent)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on::after{transform:translateX(14px)}
.fin-form{display:grid;grid-template-columns:110px minmax(0,2fr) minmax(0,1.2fr) minmax(0,1.2fr) 110px 140px auto;gap:8px;align-items:end}
.pos{color:var(--green)}.neg{color:var(--red)}
.pill-btn{border:0;background:none;padding:0}
.note{font-size:12.5px;color:var(--faint);margin-top:12px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:28px;height:28px;border-radius:8px;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line-2);background:var(--c)}
.swatch.on{box-shadow:0 0 0 2px var(--fg)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}

/* listas estilo ClickUp */
.crumb{font-size:12.5px;color:var(--faint);margin-bottom:6px}
.crumb span{margin:0 4px}
.viewtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.viewtabs button{border:0;background:transparent;display:flex;align-items:center;gap:6px;padding:8px 10px;color:var(--muted);font-weight:550;border-bottom:2px solid transparent;margin-bottom:-1px}
.viewtabs button svg{width:15px;height:15px}
.viewtabs button.on{color:var(--fg);border-color:var(--accent)}
.groups{display:flex;flex-direction:column;gap:36px}
.grp-h{display:flex;align-items:center;gap:8px;padding:0 2px 8px;font-weight:600}
.grp-h a{color:var(--fg);text-decoration:none}
.grp-h a:hover{text-decoration:underline}
.pill.up{text-transform:uppercase;letter-spacing:.04em;font-size:10.5px;padding:3px 8px;border-radius:5px}
.gtag{display:inline-block;padding:2px 9px;border-radius:5px;background:color-mix(in srgb,var(--c) 16%,var(--surface));color:color-mix(in srgb,var(--c) 70%,var(--fg));font-weight:600;font-size:12px;white-space:nowrap}
.gtag.lg{font-size:13px;padding:3px 10px}
.sicon{width:13px;height:13px;border-radius:50%;border:2px solid var(--tf);flex:none}
.tbl.lite th{border-bottom:1px solid var(--line);padding:6px 10px;font-size:10.5px}
.tbl.lite td{padding:9px 10px}
.tbl.lite td.name{max-width:420px;font-weight:500}
.tbl.lite tr:last-child td{border-bottom:1px solid var(--line)}
.bar-row{text-decoration:none;color:inherit;border-radius:6px}
.bar-row:hover .ell{color:var(--fg)}
.cgrid{gap:20px}
/* campos coloridos e cor do cliente */
.fields>*{min-width:0}
.field select.in,.field input.in{width:100%;min-width:0;text-overflow:ellipsis}
select.csel{background-color:var(--tb);color:var(--tf);border-color:transparent;font-weight:600}
select.csel:hover{border-color:var(--tf)}
select.csel.cli{--tb:color-mix(in srgb,var(--c) 15%,var(--surface));--tf:color-mix(in srgb,var(--c) 72%,var(--fg))}
select.csel option{background:var(--surface);color:var(--fg);font-weight:500}
.ftag{display:inline-flex;align-items:center;gap:5px;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:color-mix(in srgb,var(--c) 72%,var(--fg));font-weight:600}
.ftag i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.card{border-left:3px solid var(--c,var(--line))}
.tbl.lite td.name{box-shadow:inset 3px 0 0 var(--c,transparent)}
.av.uc{background:color-mix(in srgb,var(--c) 18%,var(--surface));color:color-mix(in srgb,var(--c) 75%,var(--fg))}
/* portal */
.p-head{display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.drawer-bg{position:fixed;inset:0;background:rgba(10,10,14,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:41;overflow:auto;
  padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));padding-left:18px;padding-right:max(18px,env(safe-area-inset-right,0px))}
.q-month{font-weight:620;margin:20px 0 8px;display:flex;gap:6px}
.q-item{display:block;width:100%;text-align:left;border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:10px;padding:10px 12px;background:var(--surface);margin-bottom:8px;color:var(--fg)}
.q-item:hover{background:var(--hover)}
.cal.week{grid-template-columns:repeat(7,minmax(120px,1fr))}
.cal.week .day{min-height:320px}
.wk-item{border:0;padding:0;background:none;text-align:left;display:flex;flex-direction:column;gap:4px;width:100%}
.wk-item .ev{white-space:normal}
.pp-pop{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:24px 16px}
.pp-pop .backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.pp-sheet{position:relative;width:min(960px,100%);max-height:calc(100dvh - 48px);overflow-y:auto;overflow-x:hidden;background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:18px 20px 0;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.pp-x{position:absolute;top:12px;right:12px;z-index:2}
.pp-sheet .pp-top{padding-right:44px}
@media (max-width:640px){.pp-pop{padding:10px}.pp-sheet{max-height:calc(100dvh - 20px);padding:14px 14px 0;border-radius:14px}}
.pp-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:18px}
.pp-grid{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:24px;margin-top:16px}
.pp-grid .caption{margin:0;font-size:14px}
.pp-foot{position:sticky;bottom:env(safe-area-inset-bottom,0px);display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--bg);border-top:1px solid var(--line);padding:12px 0;margin-top:24px;flex-wrap:wrap}
.msgs{display:flex;flex-direction:column;gap:10px;max-width:680px}
.bub{max-width:80%;padding:9px 13px;border-radius:12px;background:var(--surface-2)}
.bub.me{align-self:flex-end;background:var(--accent-soft)}
@media (max-width:860px){.pp-grid{grid-template-columns:minmax(0,1fr)}.pp-grid .media{max-width:320px}}
.fin-grid{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
@media (max-width:1000px){.fin-grid{grid-template-columns:minmax(0,1fr)}}
/* acessos */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;font-size:12.5px;font-weight:550;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.chip:hover{border-color:var(--line-2)}
.chip.on{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.chip.on::before{content:"✓";font-weight:700}
.person{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.person .av{width:34px;height:34px;font-size:13px}
.person .form-grid{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.as-box{display:flex;flex-direction:column;gap:5px}
/* barra superior e menu no celular */
.mtop{display:none;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;align-items:center;gap:10px;background:var(--bg);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.mtop .t{font-weight:620;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtop .mark{width:24px;height:24px;font-size:13px;border-radius:7px}
.mback{display:none;position:fixed;inset:0;background:rgba(10,10,14,.4);z-index:55}
/* barras de rolagem discretas */
*{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
/* agenda (aparece no celular abaixo do calendário) */
.agenda{display:none;flex-direction:column;gap:14px;margin-top:18px}
.ag-day{display:flex;gap:12px}
.ag-list{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.ag-item{display:flex;flex-direction:column;gap:7px;text-align:left;border:1px solid var(--line);border-left:3px solid var(--c);border-radius:10px;padding:10px 12px;background:var(--surface);color:var(--fg);min-width:0}
.date-b.on{background:var(--accent);color:var(--on-accent)}
.date-b.on span{color:inherit}
@media (max-width:760px){
  .tbl{min-width:0}
  .tbl thead{display:none}
  .tbl,.tbl tbody{display:block}

}
@media (max-width:640px){
  .cal-wrap{overflow:visible}
  .cal{min-width:0;gap:3px;grid-template-columns:repeat(7,minmax(0,1fr))}

  .ev small{display:none}
  .legend{display:none}
  .month span{min-width:120px}
}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 15px;border-radius:10px;font-weight:550;z-index:90;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px)}

@media (max-width:1100px){.fin-form{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}}
@media (max-width:860px){

    padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 0 40px rgba(0,0,0,.2)}
  body.menu .side{transform:none}
  body.menu .mback{display:block}

  .board,.tabs,.viewtabs,.cal-wrap{scrollbar-width:none}

  .sheet-b{padding:14px 16px;gap:16px}

.bk-month{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:22px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.bk-month h2{font-size:16px;margin:0}
.camp-tag{display:inline-flex;align-items:center;gap:4px;background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--accent-ink);font-weight:600}
.camp-tag svg{width:12px;height:12px}
.cr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.cr-item{background:none;border:0;padding:0;text-align:left;cursor:pointer;color:inherit;font:inherit;display:flex;flex-direction:column;gap:6px;min-width:0}
.cr-item b{font-size:12.5px;font-weight:600}
.car{position:relative}.car-t{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;height:100%}.car-t::-webkit-scrollbar{display:none}
.car-t img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:start}
.car-b{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center;cursor:pointer}
.car-b.l{left:8px}.car-b.r{right:8px}.car-b svg{width:16px;height:16px}
.car-n{position:absolute;bottom:10px;right:10px;font-size:11px;font-weight:600;background:rgba(0,0,0,.45);color:#fff;padding:3px 8px;border-radius:99px}
.slides{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.slide{position:relative;width:64px;height:80px;border-radius:8px;overflow:hidden;background:var(--surface-2)}
.slide img{width:100%;height:100%;object-fit:cover}
.slide .sx{position:absolute;inset:auto 0 0 0;display:flex;justify-content:space-between;background:rgba(0,0,0,.5)}
.slide .sx button{background:none;border:0;color:#fff;font-size:12px;padding:2px 5px;cursor:pointer}
.slide .si{position:absolute;top:3px;left:3px;font-size:10px;font-weight:700;background:rgba(0,0,0,.5);color:#fff;border-radius:6px;padding:0 5px}
.bk-list{display:flex;flex-direction:column;gap:14px}
.bk{display:grid;grid-template-columns:88px minmax(0,1fr);gap:14px;padding:14px}
.bk .media{width:88px}
.bk-h{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;flex-wrap:wrap}
.bk-h a{font-weight:600;color:var(--fg);text-decoration:none;cursor:pointer}
.bk-m{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;margin-top:10px}
.bk-m label{font-size:11.5px;color:var(--faint);display:flex;flex-direction:column;gap:3px;min-width:0}
.bk-m .in{height:32px;padding:0 8px;font-size:13px;width:100%;min-width:0}
.stars{display:inline-flex;gap:2px}.stars button{background:none;border:0;padding:2px;cursor:pointer;color:var(--line-2)}
.stars button.on{color:#F6B23A}.stars svg{width:18px;height:18px;fill:currentColor;stroke:none}
@media (max-width:560px){.bk{grid-template-columns:minmax(0,1fr)}.bk .media{width:100%;max-width:200px}}

const ucolor=id=>TEAM_COLOR[id]||UPAL[[...String(id)].reduce((a,ch)=>a+ch.charCodeAt(0),0)%UPAL.length];
const avImg=id=>{const a=(S.avatars||[]).find(x=>x.id===id);return a&&a.img||''};

const UP={},UPI={};
function shrink(file){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const M=1440,k=Math.min(1,M/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);c.toBlob(b=>b?res(b):rej(new Error('img')),'image/jpeg',.86)};img.onerror=()=>rej(new Error('Imagem inválida'));img.src=URL.createObjectURL(file)})}
async function addImages(p,files){
 files=[...files].filter(f=>f.type.startsWith('image/'));if(!files.length){toast('Escolha imagens (JPG ou PNG).');return}
 p.slides=p.slides||[];UPI[p.id]={done:0,total:files.length};if(ui.modal===p.id)renderModal();
 let fail=0;
 for(const f of files){try{const b=await shrink(f);let url;
   if(CLOUD&&sb){const path=`${p.client}/${p.id}/${Date.now().toString(36)}${Math.random().toString(36).slice(2,7)}.jpg`;const{error}=await sb.storage.from('media').upload(path,b,{contentType:'image/jpeg',cacheControl:'31536000'});if(error)throw error;url=sb.storage.from('media').getPublicUrl(path).data.publicUrl;p.slides.push({url,path,name:f.name})}
   else{url=URL.createObjectURL(b);p.slides.push({url,name:f.name,local:true})}
  }catch(e){fail++;console.warn(e)}
  UPI[p.id].done++;if(ui.modal===p.id)renderModal()}
 delete UPI[p.id];hist(p,`Enviou ${files.length-fail} imagem${files.length-fail===1?'':'ns'}`);save();if(ui.modal===p.id)renderModal();render();
 toast(fail?`${fail} imagem${fail>1?'ns':''} não subiu. Tente de novo.`:'Imagens enviadas.')}
const fsize=b=>b>=1e9?(b/1e9).toFixed(1).replace('.',',')+' GB':b>=1e6?Math.round(b/1e6)+' MB':Math.max(1,Math.round(b/1e3))+' KB';
const PART=10e6;
function dlBtn(p){const n=(p.slides||[]).filter(x=>x.url).length;const has=n||p.mediaUrl||(p.driveUrl&&driveId(p.driveUrl));if(!has)return'';
 return`<div class="row wrap" style="margin-top:10px"><button class="btn sm pri" data-act="download" data-id="${p.id}">${ic('download')}${n>1?`Baixar ${n} imagens`:n?'Baixar imagem':'Baixar vídeo'}</button></div>`}
function slug(t){return String(t||'post').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w]+/g,'-').replace(/^-|-$/g,'').toLowerCase().slice(0,40)||'post'}
async function downloadPost(p){
 const sl=(p.slides||[]).filter(x=>x.url),base=slug(p.title);
 const go=(url,name)=>{const a=document.createElement('a');a.href=url;a.download=name;a.rel='noopener';document.body.appendChild(a);a.click();a.remove()};
 if(sl.length){toast(sl.length>1?`Baixando ${sl.length} imagens…`:'Baixando imagem…');
  for(let i=0;i<sl.length;i++){const name=`${base}-${String(i+1).padStart(2,'0')}.jpg`;
   try{const r=await fetch(sl[i].url);const b=await r.blob();const u=URL.createObjectURL(b);go(u,name);setTimeout(()=>URL.revokeObjectURL(u),4000)}catch(e){go(sl[i].url+(sl[i].url.includes('?')?'&':'?')+'download='+encodeURIComponent(name),name)}
   await new Promise(r=>setTimeout(r,350))}
  return}
 if(p.mediaUrl){go(p.mediaUrl,p.mediaName||base+'.mp4');return}
 const id=driveId(p.driveUrl);if(id){window.open(`https://drive.google.com/uc?export=download&id=${id}`,'_blank','noopener');toast('Abrindo o download no Google Drive.')}
}
function upHtml(p){
 const sl=p.slides||[];
 if(IMG_FMT.includes(p.format)){
  const st=UPI[p.id];
  return`${sl.length?`<div class="slides">${sl.map((x,i)=>`<div class="slide"><img src="${esc(x.url)}" alt=""><span class="si">${i+1}</span><div class="sx"><button data-act="slMove" data-i="${i}" data-d="-1" aria-label="Mover para a esquerda">‹</button><button data-act="slDel" data-i="${i}" aria-label="Remover">✕</button><button data-act="slMove" data-i="${i}" data-d="1" aria-label="Mover para a direita">›</button></div></div>`).join('')}</div>`:''}
  ${st?`<div class="upbox"><div class="nm">Enviando ${st.done} de ${st.total} imagens…</div><div class="upbar"><i style="width:${Math.round(st.done/st.total*100)}%"></i></div></div>`
   :`<label class="dz" data-filedrop>${ic('upload')}<b>${sl.length?'Adicionar mais imagens':'Arraste as imagens aqui'}</b><span>ou clique para escolher · pode selecionar várias</span><small>JPG ou PNG · a ordem é a do carrossel</small><input type="file" accept="image/*" multiple data-chg="media"></label>`}`}
 const u=UP[p.id];
 if(u&&!u.done){const pct=Math.floor(u.loaded/u.size*100),parts=Math.max(1,Math.ceil(u.size/PART)),cur=Math.min(parts,Math.floor(u.loaded/PART)+1);
  return`<div class="upbox" id="upbox"><div class="nm">${esc(u.name)}</div><div class="upbar"><i id="upbar" style="width:${pct}%"></i></div>
  <div class="meta"><span id="uptxt">${pct}% · ${fsize(u.loaded)} de ${fsize(u.size)}</span><span id="uppart">parte ${cur} de ${parts}</span></div>
  <div class="row between"><span class="meta">Pode fechar esta janela, o envio continua.</span><button class="btn sm ghost" data-act="cancelUp">Cancelar</button></div></div>`}
 if(p.mediaUrl)return`<div class="upbox"><div class="nm">${esc(p.mediaName||'Arquivo')}</div><div class="meta"><span class="upok">✓ Enviado</span><span>${p.mediaSize?fsize(p.mediaSize):''}</span></div>
  <div class="upl" style="margin-top:0"><label class="btn sm">${ic('upload')}Trocar arquivo<input type="file" accept="video/*,image/*" data-chg="media"></label><button class="btn sm ghost" data-act="clearMedia">Remover</button></div></div>`;
 return`<label class="dz" data-filedrop>${ic('upload')}<b>Arraste o vídeo ou a arte aqui</b><span>ou clique para escolher</span><small>MP4, MOV, JPG ou PNG · até 2 GB</small><input type="file" accept="video/*,image/*" data-chg="media"></label>`;
}
function startUpload(p,f){
 if(!/^(video|image)\//.test(f.type)){toast('Envie um vídeo ou uma imagem.');return}
 if(f.size>2e9){toast('Arquivo acima de 2 GB.');return}
 if(UP[p.id])clearInterval(UP[p.id].timer);
 const u=UP[p.id]={name:f.name,size:f.size,loaded:0,file:f};
 const rate=Math.max(f.size/7,4e6);
 u.timer=setInterval(()=>{
  u.loaded=Math.min(u.size,u.loaded+rate/5);
  const pct=Math.floor(u.loaded/u.size*100),parts=Math.max(1,Math.ceil(u.size/PART)),cur=Math.min(parts,Math.floor(u.loaded/PART)+1);
  const b=document.getElementById('upbar'),t=document.getElementById('uptxt'),pt=document.getElementById('uppart');
  if(ui.modal===p.id&&b){b.style.width=pct+'%';t.textContent=`${pct}% · ${fsize(u.loaded)} de ${fsize(u.size)}`;pt.textContent=`parte ${cur} de ${parts}`}
  if(u.loaded>=u.size){clearInterval(u.timer);u.done=true;delete UP[p.id];
   if(p.mediaUrl)try{URL.revokeObjectURL(p.mediaUrl)}catch(e){}
   p.mediaUrl=URL.createObjectURL(f);p.mediaType=f.type;p.mediaName=f.name;p.mediaSize=f.size;
   hist(p,`Enviou o arquivo ${f.name}`);save();toast('Arquivo enviado.');if(ui.modal===p.id)renderModal();render()}
 },200);
 if(ui.modal===p.id)renderModal();
}
function media(p,cls=''){
 const c=cl(p.client);
 const sl=(p.slides||[]).filter(x=>x&&x.url);
 if(sl.length){if(cls||sl.length===1)return`<div class="media ${cls}" style="--ar:${AR[p.format]}"><img src="${esc(sl[0].url)}" alt="" loading="lazy"><span class="m-fmt">${FMT[p.format]}</span>${sl.length>1?`<span class="car-n">1/${sl.length}</span>`:''}</div>`;
  return`<div class="media car" style="--ar:${AR[p.format]}"><div class="car-t">${sl.map(x=>`<img src="${esc(x.url)}" alt="" loading="lazy">`).join('')}</div><button class="car-b l" data-act="carNav" data-d="-1" aria-label="Imagem anterior">${ic('chevL')}</button><button class="car-b r" data-act="carNav" data-d="1" aria-label="Próxima imagem">${ic('chevR')}</button><span class="car-n">1/${sl.length}</span></div>`}
 if(p.mediaUrl)return`<div class="media ${cls}" style="--ar:${AR[p.format]}">${p.mediaType&&p.mediaType.startsWith('video')?`<video src="${p.mediaUrl}" controls playsinline></video>`:`<img src="${p.mediaUrl}" alt="">`}<span class="m-fmt">${FMT[p.format]}</span></div>`;
 if(p.driveUrl&&driveId(p.driveUrl)&&!cls)return`<div class="media" style="--ar:${AR[p.format]}"><iframe src="https://drive.google.com/file/d/${driveId(p.driveUrl)}/preview" allow="autoplay" allowfullscreen title="Vídeo do Google Drive"></iframe></div>`;
 return`<div class="media ph ${cls}" style="--c:${c.color};--ar:${AR[p.format]}"><span class="m-fmt">${FMT[p.format]}</span><span class="m-title">${esc(topic(p))}</span><span class="m-client">${esc(c.name)}</span></div>`;
}
function sortDate(a,b){return(a.date||'9999').localeCompare(b.date||'9999')}
function filtered(){const f=ui.f;return S.posts.filter(p=>!p.archived&&(f.client==='all'||p.client===f.client)&&(f.format==='all'||p.format===f.format)&&(f.owner==='all'||p.owner===f.owner)&&(f.phase==='all'||phase(p)===f.phase)&&(!f.q||(p.title+' '+cl(p.client).name).toLowerCase().includes(f.q.toLowerCase()))).sort(sortDate)}

 const F=S.fin.filter(e=>e.due.slice(0,7)===ym);const sum=(arr)=>arr.reduce((a,e)=>a+Number(e.value||0),0);

function vCalendario(){
 const m=ui.calMonth,y=m.getFullYear(),mo=m.getMonth();
 const inMonth=S.posts.filter(p=>p.date&&p.date.slice(0,7)===`${y}-${pad(mo+1)}`&&(ui.calClient==='all'||p.client===ui.calClient));
 const counts=Object.keys(PH).map(k=>[k,inMonth.filter(p=>phase(p)===k).length]);
 const head=`<div class="page-head"><div><h1>Calendário</h1><div class="sub">Datas de postagem preenchidas pela equipe. Arraste um post para outro dia para mudar a data.</div></div>
  <div class="actions"><button class="btn pri" data-act="newPost">${ic('plus')}Novo conteúdo</button></div></div>
  <div class="cal-head">
   <div class="row wrap" style="gap:10px">
    <div class="month"><button class="icon-btn" data-act="calNav" data-d="-1" aria-label="Mês anterior">${ic('chevL')}</button><span>${MESES[mo]} ${y}</span><button class="icon-btn" data-act="calNav" data-d="1" aria-label="Próximo mês">${ic('chevR')}</button></div>
    <button class="btn sm" data-act="calToday">Hoje</button>
    <select class="sel" data-chg="calClient" aria-label="Cliente">${opt('all','Todos os clientes',ui.calClient)}${S.clients.map(c=>opt(c.id,c.name,ui.calClient)).join('')}</select>
    <div class="seg"><button data-act="calMode" data-v="mes" class="${ui.calMode==='mes'?'on':''}">${ic('cal')}Mensal</button><button data-act="calMode" data-v="feed" class="${ui.calMode==='feed'?'on':''}">${ic('grid')}Feed</button></div>
   </div>
   <div class="counters">${counts.map(([k,n])=>`<span class="t-${PH[k][1]}"><b>${n}</b>${PH[k][0]}</span>`).join('')}</div>
  </div>`;
 if(ui.calMode==='feed')return head+feedView();
 const first=new Date(y,mo,1);const start=addDays(first,-first.getDay());
 const last=new Date(y,mo+1,0);const end=addDays(last,6-last.getDay());
 let cells='';for(let d=new Date(start);d<=end;d=addDays(d,1)){
  const di=iso(d),key=`${pad(d.getMonth()+1)}-${pad(d.getDate())}`,h=HOL[key];

  cells+=`<div class="day ${d.getMonth()!==mo?'out':''} ${di===TODAY_ISO?'today':''}" data-dropdate="${di}">
   <div class="day-n"><b>${d.getDate()}</b><button class="add" data-act="newOn" data-date="${di}" aria-label="Novo conteúdo em ${fmtD(di)}">${ic('plus')}</button></div>
   ${h?`<div class="hol ${h.endsWith('|s')?'saude':''}" title="${esc(h.replace('|s',''))}">${esc(h.replace('|s',''))}</div>`:''}
   ${ps.map(p=>`<button class="ev t-${PH[phase(p)][1]}" style="border-left-color:${cl(p.client).color}" draggable="true" data-drag="${p.id}" data-act="open" data-id="${p.id}" title="${esc(p.title)}">${esc(topic(p))}<small>${ui.calClient==='all'?esc(cl(p.client).short)+' · ':''}${FMT[p.format]}</small></button>`).join('')}
  </div>`;
 }
 return head+`<div class="cal-wrap"><div class="cal">${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(d=>`<div class="dow">${d}</div>`).join('')}${cells}</div></div>
  <div class="legend">${Object.values(PH).map(v=>`<span class="t-${v[1]}"><span class="dot"></span>${v[0]}</span>`).join('')}<span><span class="hol saude" style="padding:0 6px">Data da saúde</span></span></div>`+agendaHtml(inMonth,'open');
}

/* ---------- PORTAL DO CLIENTE (formato calendário + fila) ---------- */
Object.assign(ui,{pMode:'mes',pMonth:new Date(TODAY.getFullYear(),TODAY.getMonth(),1),pWeek:addDays(TODAY,-TODAY.getDay()),pQueue:false,pPost:null,pTab:'conteudo',pFmt:'all',pPh:'all'});

function pContent(){
 const P=pPosts();const wk=ui.pMode==='semana';

 }

 let cells='';
 for(let d=new Date(start);d<=end;d=addDays(d,1)){

   :ps.map(p=>`<button class="ev t-${PH[phase(p)][1]}" data-act="pOpen" data-id="${p.id}" title="${esc(p.title)}">${esc(topic(p))}<small>${FMT[p.format]}</small></button>`).join('');

 }
 return bar+`<div class="cal-wrap"><div class="cal ${wk?'week':''}">${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(x=>`<div class="dow">${x}</div>`).join('')}${cells}</div></div>`+agendaHtml(R,'pOpen');
}

/* ---------- CAMPANHAS ---------- */
const CST={Planejada:'gray',Ativa:'green',Pausada:'amber',Encerrada:'blue'};
function vCampanhas(){
 const order={Ativa:0,Planejada:1,Pausada:2,Encerrada:3};
 const L=[...S.campaigns].sort((a,b)=>order[a.status]-order[b.status]);

/* ---------- MODAL DO CONTEÚDO ---------- */
function stepsBar(p){
 const route=['ideia','copy','criacao',prodStage(p),'aprov','pub'];const idx=route.indexOf(p.stage);
 return`<div class="steps">${route.map((s,i)=>`${i?'<i>›</i>':''}<span class="${i===idx?'on':i<idx?'done':''}">${ST[s].short}</span>`).join('')}</div>`;
}
function actionsFor(p){
 const c=cl(p.client),A=[];
 switch(p.stage){
  case'ideia':A.push(['Mover para Copywriting',()=>move(p,'copy')]);break;
  case'copy':
   if(c.approvesCopy){
    if(p.status==='Aprovação do cliente')A.push(['Aguardando o cliente aprovar a copy',null]);
    else if(p.status!=='Copy aprovada')A.push(['Enviar copy para o cliente',()=>setStatus(p,'Aprovação do cliente','Enviou a copy para o cliente aprovar'),'sec']);
   }
   if(p.status!=='Aprovação do cliente')A.push(['Mover para Criação',()=>move(p,'criacao')]);break;
  case'criacao':{const t=prodStage(p);A.push([`Mover para ${ST[t].name}`,()=>move(p,t)]);break}
  case'design':case'edicao':A.push(['Enviar para aprovação do cliente',()=>move(p,'aprov','Em aprovação')]);break;
  case'aprov':
   if(p.status==='Em aprovação')A.push(['Aguardando o cliente',null]);
   else if(p.status==='Ajuste'){const t=prodStage(p);A.push([`Voltar para ${ST[t].name}`,()=>move(p,t,ST[t].statuses[1])])}
   else A.push(['Mover para Gestão de publicação',()=>move(p,'pub','Para agendar')]);break;
  case'pub':
   if(p.status==='Para agendar')A.push(['Marcar como agendado',()=>setStatus(p,'Agendado','Agendou na rede social')]);
   else if(p.status==='Agendado')A.push(['Marcar como postado',()=>setStatus(p,'Postado','Marcou como postado')]);break;
 }
 return A;
}
function move(p,stage,status){p.stage=stage;p.status=status||ST[stage].statuses[0];hist(p,`Moveu para ${ST[stage].name}`);}
function setStatus(p,s,txt){p.status=s;hist(p,txt||`Mudou o status para ${s}`);autoFlow(p)}
const IMG_FMT=['carrossel','estatico','stories'];
function DEFAULT_RULES(){return[
 {id:'r1',name:'Copy aprovada de imagem vai para Design',on:true,when:{stage:'copy',status:'Copy aprovada',formats:['carrossel','estatico','stories'],client:'all'},then:{stage:'design',status:'Para fazer',owner:''}},
 {id:'r2',name:'Copy aprovada de vídeo vai para Criação',on:true,when:{stage:'copy',status:'Copy aprovada',formats:['reels'],client:'all'},then:{stage:'criacao',status:'Para fazer',owner:''}}]}
const ruleHits=(r,p)=>r.on&&r.when&&p.stage===r.when.stage&&(!r.when.status||p.status===r.when.status)&&(!(r.when.formats||[]).length||r.when.formats.includes(p.format))&&(!r.when.client||r.when.client==='all'||p.client===r.when.client);
function applyRules(p,quiet){let moved=false;
 for(let i=0;i<5;i++){const r=(S.rules||[]).find(r=>ruleHits(r,p)&&r.then&&r.then.stage&&!(r.then.stage===p.stage&&(r.then.status||ST[r.then.stage].statuses[0])===p.status));if(!r)break;
  p.stage=r.then.stage;p.status=r.then.status||ST[r.then.stage].statuses[0];if(r.then.owner)p.owner=r.then.owner;
  p.history=p.history||[];p.history.push({t:nowStamp(),who:'Automação',txt:`“${r.name}”: foi para ${ST[p.stage].name} · ${p.status}`});moved=true;
  if(!quiet)try{toast(`Automação: foi para ${ST[p.stage].name}.`)}catch(e){}}
 if(moved)save();return moved}
function autoFlow(p){
 if(applyRules(p))return;
 if(p.stage==='pub'&&p.status==='Postado'&&!p.postedAt){p.postedAt=new Date().toISOString();save()}
 if(p.stage==='pub'&&p.status!=='Postado'&&p.postedAt){delete p.postedAt;p.archived=false;save()}
}
const schedTs=p=>p.date?new Date(p.date+'T'+(p.time||'09:00')+':00').getTime():null;
function autoTick(){let ch=false;const now=Date.now();
 S.posts.forEach(p=>{if(p.stage!=='pub')return;
  if(p.status==='Agendado'){const t=schedTs(p);if(t&&t<=now){p.status='Postado';p.archived=false;p.postedAt=new Date(t).toISOString();hist(p,'Marcou como postado no horário agendado','Automação');ch=true}}
  if(p.status==='Postado'&&!p.archived){if(!p.postedAt){p.postedAt=new Date().toISOString();ch=true}else if(Date.parse(p.postedAt)+6e5<=now){p.archived=true;hist(p,'Foi para o Banco de posts','Automação');ch=true}}
 });
 if(ch){save();render()}}
function hist(p,txt,who){p.history.push({t:nowStamp(),who:who||(CLOUD?REAL():ME()).name,txt});save()}

function renderModal(){
 const m=document.getElementById('modal');const p=S.posts.find(x=>x.id===ui.modal);
 if(!p){m.hidden=true;m.innerHTML='';document.body.classList.remove('modal-open');return}
 document.body.classList.add('modal-open');
 const st=ST[p.stage];ui.acts=actionsFor(p);
 const ids=navList().map(x=>x.id);const i=ids.indexOf(p.id);
 const tabs=[['legenda','Legenda'],['briefing','Briefing'],['comentarios',`Comentários (${p.comments.length})`],['historico','Histórico']];
 let body='';

function authCard(mode,msg){
 const err=msg?`<div class="auth-err">${esc(msg)}</div>`:'';
 const head=(t,p)=>`${LOGO}<h1>${t}</h1>${p?`<p>${p}</p>`:''}`;
 const F={

  primeiro:()=>`${head('Primeiro acesso','Crie sua senha com o e-mail que o administrador cadastrou na equipe.')}<form data-auth="primeiro"><label>E-mail<input class="in" name="email" type="email" autocomplete="email" required></label><label style="margin-top:10px">Crie uma senha (mínimo 8 caracteres)<input class="in" name="pass" type="password" minlength="8" autocomplete="new-password" required></label>${err}<button class="btn pri" style="width:100%;margin-top:14px">Criar acesso</button></form><div class="auth-links"><button data-amode="login">Já tenho senha</button></div>`,

  esqueci:()=>`${head('Recuperar senha','Enviamos um link para você criar uma senha nova.')}<form data-auth="esqueci"><label>E-mail<input class="in" name="email" type="email" required></label>${err}<button class="btn pri" style="width:100%;margin-top:14px">Enviar link</button></form><div class="auth-links"><button data-amode="login">Voltar</button></div>`,
  enviado:()=>`${head('Link enviado','Abra seu e-mail e siga o link para criar a senha nova.')}<div class="auth-links"><button data-amode="login">Voltar para o login</button></div>`,
  nova:()=>`${head('Nova senha','')}<form data-auth="nova"><label>Nova senha (mínimo 8 caracteres)<input class="in" name="pass" type="password" minlength="8" autocomplete="new-password" required></label>${err}<button class="btn pri" style="width:100%;margin-top:14px">Salvar senha</button></form>`,
  semacesso:()=>`${head('Sem acesso',`O e-mail ${esc(meEmail)} não está na equipe. Peça ao administrador para cadastrá-lo em Equipe e acessos.`)}<button class="btn" data-act="logout">Sair</button>`,
  erro:()=>`${head('Não foi possível conectar',msg||'Verifique sua internet e tente de novo.')}<button class="btn" onclick="location.reload()">Tentar de novo</button>`
 };
 return`<div class="auth-card">${(F[mode]||F.login)()}</div>`;
}
function showAuth(mode,msg){const a=document.getElementById('auth');a.hidden=false;a.innerHTML=authCard(mode,msg);const i=a.querySelector('input');if(i)i.focus()}

const redirect=()=>location.origin+location.pathname;
document.addEventListener('click',e=>{const b=e.target.closest('[data-amode]');if(b){e.preventDefault();showAuth(b.dataset.amode)}});
document.addEventListener('submit',async e=>{const f=e.target.closest('[data-auth]');if(!f)return;e.preventDefault();
 const m=f.dataset.auth,email=(f.email&&f.email.value.trim())||'',pass=f.pass&&f.pass.value;const btn=f.querySelector('button');btn.disabled=true;
 try{
  if(m==='login'){const{data,error}=await sb.auth.signInWithPassword({email,password:pass});if(error)throw error;await enter(data.session)}
  if(m==='primeiro'){const{data,error}=await sb.auth.signUp({email,password:pass,options:{emailRedirectTo:redirect()}});if(error)throw error;if(data.session)await enter(data.session);else showAuth('confirme')}
  if(m==='esqueci'){const{error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:redirect()});if(error)throw error;showAuth('enviado')}
  if(m==='nova'){const{error}=await sb.auth.updateUser({password:pass});if(error)throw error;const{data}=await sb.auth.getSession();toast('Senha salva.');await enter(data.session)}
 }catch(err){const t=String(err.message||err);showAuth(m,/Invalid login/i.test(t)?'E-mail ou senha incorretos.':/not confirmed/i.test(t)?'Confirme seu e-mail pelo link que enviamos.':/already registered/i.test(t)?'Este e-mail já tem acesso. Use “Já tenho senha”.':/rate limit/i.test(t)?'Muitas tentativas. Espere alguns minutos.':t)}
});
function snapshot(){snap={};COLLS.forEach(c=>(S[c]||[]).forEach(x=>{snap[c+'|'+x.id]=ser(x)}));snap['settings|main']=ser(shared())}
async function enter(session){
 if(!session){showAuth('login');return}
 meEmail=(session.user.email||'').toLowerCase();showAuth('carregando');
 const{data,error}=await sb.from('items').select('coll,id,data').order('created_at',{ascending:true});
 if(error){showAuth('erro',error.message);return}
 const N={clients:[],team:[],posts:[],campaigns:[],fin:[],msgs:[],avatars:[],rules:[]};let st=null;
 data.forEach(r=>{if(r.coll==='settings')st=r.data;else if(N[r.coll])N[r.coll].push(r.data)});
 const me=N.team.find(u=>(u.email||'').toLowerCase()===meEmail);
 if(!me){showAuth('semacesso');return}
 Object.assign(S,N);S.settings=Object.assign({accent:'#1A3FF5'},st||{});
 try{S.settings.theme=localStorage.getItem('stage-theme')||'system'}catch(e){S.settings.theme='system'}
 realId=me.id;ui.as=me.id;if(!S.clients.find(c=>c.id===ui.portalClient)&&S.clients[0])ui.portalClient=S.clients[0].id;
 snapshot();
 if(isAdmin(me)&&!S.rules.length&&!S.settings.rulesSeeded){S.rules=DEFAULT_RULES();S.settings.rulesSeeded=true;save()}
 S.posts.forEach(p=>applyRules(p,true));
 hideAuth();applyTheme();route();subscribe();
}
function cloudSave(){if(!sb||!realId)return;clearTimeout(syncT);syncT=setTimeout(push,400)}
async function push(){
 const ups=[],dels={},live=new Set();
 COLLS.forEach(c=>(S[c]||[]).forEach(x=>{if(!x.id)x.id=uid(c[0]);const k=c+'|'+x.id,j=ser(x);live.add(k);if(snap[k]!==j){ups.push({coll:c,id:x.id,data:JSON.parse(j),updated_at:new Date().toISOString()});snap[k]=j}}));
 const sj=ser(shared());live.add('settings|main');if(snap['settings|main']!==sj&&isAdmin(REAL())){ups.push({coll:'settings',id:'main',data:JSON.parse(sj),updated_at:new Date().toISOString()});snap['settings|main']=sj}
 Object.keys(snap).forEach(k=>{if(!live.has(k)){const[c,id]=k.split('|');(dels[c]=dels[c]||[]).push(id);delete snap[k]}});
 if(!ups.length&&!Object.keys(dels).length)return;
 dot('Salvando…');
 try{
  if(ups.length){const{error}=await sb.from('items').upsert(ups);if(error)throw error}
  for(const c in dels){const{error}=await sb.from('items').delete().eq('coll',c).in('id',dels[c]);if(error)throw error}
  dot('Salvo');
 }catch(err){dot('');toast('Não foi possível salvar: '+(/row-level|permission/i.test(err.message)?'você não tem permissão para isso.':err.message));const{data}=await sb.auth.getSession();enter(data.session)}
}
let dotT;function dot(t){let d=document.getElementById('syncdot');if(!d){d=document.createElement('div');d.id='syncdot';d.className='syncdot';document.body.appendChild(d)}d.textContent=t;d.hidden=!t;clearTimeout(dotT);if(t==='Salvo')dotT=setTimeout(()=>{d.hidden=true},1500)}
let subbed=false;function subscribe(){if(subbed)return;subbed=true;
 sb.channel('items-live').on('postgres_changes',{event:'*',schema:'public',table:'items'},pl=>{
  const del=pl.eventType==='DELETE',r=del?pl.old:pl.new;if(!r||!r.coll)return;const k=r.coll+'|'+r.id;
  if(r.coll==='settings'){if(!del){const j=ser(r.data);if(snap[k]===j)return;snap[k]=j;Object.assign(S.settings,r.data);applyTheme()}return}
  const arr=S[r.coll];if(!arr)return;const i=arr.findIndex(x=>x.id===r.id);
  if(del){if(i<0)return;arr.splice(i,1);delete snap[k]}
  else{const j=ser(r.data);if(snap[k]===j)return;snap[k]=j;const keep=i>=0?{mediaUrl:arr[i].mediaUrl,mediaType:arr[i].mediaType,mediaName:arr[i].mediaName,mediaSize:arr[i].mediaSize}:{};
   const obj=Object.assign(r.data,Object.fromEntries(Object.entries(keep).filter(([,v])=>v!==undefined)));if(i>=0)arr[i]=obj;else arr.push(obj);if(r.coll==='posts')applyRules(obj,true)}
  if(r.coll==='team'||r.coll==='avatars'){if(r.coll==='team'&&!S.team.find(u=>u.id===realId)){showAuth('semacesso');return}applyTheme()}
  if(ui.modal&&ui.modal===r.id&&del){closeModal();toast('Este conteúdo foi excluído por outra pessoa.')}
  liveRender(ui.modal===r.id);
 }).subscribe();
}

 if(error||!data){showAuth('erro',error?error.message:'Link inválido ou desativado. Peça um novo link para a equipe.');return false}
 S.clients=[data.client];S.posts=data.posts||[];S.msgs=data.msgs||[];S.team=[{id:'cli',name:data.client.name,email:'',role:'membro',perms:{portal:true,stages:[]}}];
 if(data.accent)S.settings.accent=data.accent;ui.as='cli';ui.portalClient=data.client.id;return true}
async function portalAct(pid,act,txt,ok){const{data,error}=await sb.rpc('portal_act',{tok:portalTok,pid:pid||'',act,txt:txt||''});
 if(error||!data){toast('Não foi possível enviar. Tente de novo.');return}
 toast(ok);await portalLoad();render()}
async function clientBoot(){
 ui.clientMode=true;document.body.classList.add('client-mode');document.title='Portal de aprovação';showAuth('carregando');
 const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js';
 sc.onload=async()=>{try{sb=window.supabase.createClient(CLOUD.url,CLOUD.key,{auth:{persistSession:false}});
  if(!await portalLoad())return;hideAuth();applyTheme();ui.view='portal';render();
  setInterval(async()=>{if(document.hidden||document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;if(await portalLoad())render()},60000);
 }catch(e){showAuth('erro',String(e.message||e))}};
 sc.onerror=()=>showAuth('erro');document.head.appendChild(sc)}
function boot(){
 if(CLOUD){const q=new URLSearchParams(location.search).get('portal');if(q){portalTok=q;clientBoot();return}}
 if(!CLOUD){applyTheme();route();autoTick();setInterval(autoTick,30000);return}
 showAuth('carregando');const isRec=/type=recovery/.test(location.hash);
 const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js';
 sc.onload=async()=>{try{
  sb=window.supabase.createClient(CLOUD.url,CLOUD.key,{auth:{persistSession:true,detectSessionInUrl:true}});
  let recovering=false;
  sb.auth.onAuthStateChange((ev)=>{if(ev==='PASSWORD_RECOVERY'){recovering=true;showAuth('nova')}});
  const{data}=await sb.auth.getSession();
  if(isRec||recovering){showAuth('nova');return}
  if(location.hash.includes('access_token'))history.replaceState(null,'',location.pathname);
  if(data.session)await enter(data.session);else showAuth('login');
 }catch(e){showAuth('erro',String(e.message||e))}};
 sc.onerror=()=>showAuth('erro');document.head.appendChild(sc);
}
boot();
</script>
